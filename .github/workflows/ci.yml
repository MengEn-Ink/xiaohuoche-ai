name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q xzq pipeline.py scripts

      - name: Run tests
        run: >
          python -m pytest -q
          tests/test_open_source_snapshot.py
          tests/test_config.py
          tests/test_strava_auth.py
          tests/test_wechat_token.py
          tests/test_pipeline.py
          tests/test_quality_check.py

      - name: Check open source snapshot
        run: python scripts/check_open_source_snapshot.py .

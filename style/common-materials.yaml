# 辛庄桥小火车常用文案素材
# 只收录用户明确确认过的固定用语；新增口号前先确认，不自行扩写。

brand:
  name: 辛庄桥小火车
  abbreviation: XZQ
  clothing_mark: TEAM XZQ

slogans:
  - text: 干就完了
    usage: 封面、人物大头贴背景、章节收尾
    tone: 最大字号、粗黑描边、硬阴影
  - text: 拿 KOM，爆金币
    usage: KOM 成绩与奖励素材
    tone: 大字、金币黄、红色硬阴影
  - text: 多来点江浙沪骑法，不要学那屯子傻骑战法
    usage: 密云水库绕圈宽哥点评
    tone: 保留原话，不改写，不扩写

forbidden_replacements:
  - wrong: 骑就完了
    correct: 干就完了
    reason: 用户明确指定固定口号
  - wrong: XHC
    correct: XZQ
    reason: 俱乐部对外缩写固定为 XZQ

fixed_terms:
  - Ride
  - KOM
  - XDM
  - TEAM XZQ
  - 密云绕圈
  - 密云水库绕圈
  - 妙峰山
  - 六石红井

image_policy:
  - 人物只允许非生成式抠图、裁切和等比例放大，保持原图像素与真实原貌。
  - 禁止 AI 换脸、补脸、美颜、磨皮、重绘五官、改体型、改服装或改姿势。
  - 抠图不完整时改用原图，不做生成式补全。
  - 保留原图中的全部人物，放大和裁切不得遗漏边缘人物；文字不得遮挡人物脸部、身体主体和服装标识。
  - 透明人物图先按 alpha 包围盒裁掉透明空边，再等比例放大；只裁空边，不裁人物。
  - 图片和文字优先叠层融合，文字放安全区域；一行能展示时不拆成纵向多行。
  - 新素材够用时移除无关旧风景图，不用历史照片凑版。

copy_checks:
  - 发布前逐字检查标题、口号、地名、人物称呼与英文缩写。
  - 不把群内原话改成近义词，不自行创造新口号。
  - 口号优先从本文件取值；未收录的新口号先向用户确认。
  - “第一张/第二张/上面/下面”等素材指引不得进入成稿。
  - 字多文案必须横向成行并按语义自然换行，禁止竖排、窄列和逐字列展示；只有总字数不超过 10 字、最多 2 个短句且单句不超过 6 字时可以列式展示。
  - 正文展示字不得小于 68px；必须使用高饱和对撞色、粗黑描边或硬阴影和边界明确的显眼色块。
  - 每个章节都要高密度承载文字或图片信息，避免大面积纯背景留白，同时不得缩小字体或遮挡人物来换密度。
